name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore FlashLock.sln
      - name: Build
        run: dotnet build FlashLock.sln -c Release --no-restore
      - name: Test
        run: dotnet test tests/FlashLock.Core.Tests/FlashLock.Core.Tests.csproj -c Release --no-build --verbosity normal
